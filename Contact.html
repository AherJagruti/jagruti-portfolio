<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me | Jagruti Aher</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- Contact Card Container -->
  <div class="w-full max-w-lg bg-gradient-to-br from-slate-950 via-purple-950/60 to-slate-950 border border-purple-500/30 rounded-2xl p-8 shadow-2xl shadow-purple-900/30 backdrop-blur-md">
    
    <!-- Header Info -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-1">Jagruti Aher</h1>
      <p class="text-purple-400 font-medium text-sm tracking-wide mb-2">Software Developer</p>
      <a href="mailto:jagrutiaher2004@gmail.com" class="text-white/70 hover:text-purple-300 transition-colors text-sm underline underline-offset-4">
        jagrutiaher2004@gmail.com
      </a>
    </div>

    <!-- Title -->
    <div class="border-t border-white/10 pt-6 mb-6">
      <h2 class="text-2xl font-bold text-center text-white">Contact Me</h2>
    </div>

    <!-- Form -->
    <form onsubmit="return validateForm()" class="space-y-5">
      <div>
        <label for="name" class="block text-sm font-semibold text-white/90 mb-2">Your Name *</label>
        <input 
          type="text" 
          id="name" 
          placeholder="Enter your name" 
          class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-white/40 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all"
        >
      </div>

      <div>
        <label for="email" class="block text-sm font-semibold text-white/90 mb-2">Your Email *</label>
        <input 
          type="email" 
          id="email" 
          placeholder="Enter your email" 
          class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-white/40 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all"
        >
      </div>

      <div>
        <label for="message" class="block text-sm font-semibold text-white/90 mb-2">Your Message *</label>
        <textarea 
          id="message" 
          rows="4" 
          placeholder="Write your message" 
          class="w-full px-4 py-3 rounded-lg bg-white/5 border border-white/10 text-white placeholder-white/40 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all resize-none"
        ></textarea>
      </div>

      <button 
        type="submit" 
        class="w-full py-3.5 px-6 rounded-lg bg-gradient-to-r from-violet-600 to-purple-600 hover:from-violet-500 hover:to-purple-500 text-white font-bold text-base shadow-lg shadow-purple-900/50 transition-all transform hover:-translate-y-0.5 active:translate-y-0"
      >
        Submit
      </button>
    </form>

    <!-- Footer & Return Link -->
    <div class="mt-8 pt-4 border-t border-white/10 text-center flex flex-col items-center gap-3">
      <a href="index.html" class="text-purple-400 hover:text-purple-300 text-xs font-semibold uppercase tracking-wider transition-colors">
        &larr; Back to Portfolio
      </a>
      <p class="text-xs text-white/50">&copy; 2026 Jagruti Aher. All rights reserved.</p>
    </div>

  </div>

  <!-- Form Validation Script -->
  <script>
    function validateForm() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (!name || !email || !message) {
        alert("All fields are required!");
        return false;
      }
      if (!email.includes("@")) {
        alert("Enter valid email!");
        return false;
      }
      alert("Message sent successfully!");
      return true;
    }
  </script>
</body>
</html>
